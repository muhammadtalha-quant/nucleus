allow-missing-formatter = false
excludes = ["*.md", "*.yaml", "*.toml", "*.lock"]
fail-on-change = true
formatters = ["nix"]
on-unmatched = "info"
tree-root-cmd = "git rev-parse --show-toplevel"
verbose = 1
walk = "filesystem"

[formatter.nix]
command = "nixfmt"
options = ["--width=100", "--indent=2"]
includes = ["*.nix"]
excludes = []
priority = 0
